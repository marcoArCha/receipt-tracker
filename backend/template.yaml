AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Receipt Tracker with OCR - backend infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ReceiptsTable
        BUCKET_NAME: !Sub receipt-tracker-images-${AWS::AccountId}

Resources:

  # ---------- Storage ----------

  ReceiptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: receipts-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub receipt-tracker-images-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ---------- Auth ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: receipt-tracker-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: receipt-tracker-web
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ---------- API Gateway ----------

  ReceiptApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ---------- Shared Lambda Layer ----------

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: receipt-tracker-common
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ---------- Lambda functions ----------

  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/presign_upload/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptsTable
        - S3CrudPolicy:
            BucketName: !Ref ReceiptsBucket
      Events:
        PresignUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/presign
            Method: POST

  ProcessReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/process_receipt/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptsTable
        - S3ReadPolicy:
            BucketName: !Sub receipt-tracker-images-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action: textract:AnalyzeExpense
              Resource: "*"
      # Note: no route under /receipts here since this function isn't
      # called by a client - it's invoked automatically by S3 below.
      Events:
        ReceiptUploaded:
          Type: S3
          Properties:
            Bucket: !Ref ReceiptsBucket
            Events: s3:ObjectCreated:*

  GetReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_receipts/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReceiptsTable
      Events:
        GetReceipts:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts
            Method: GET

  GetReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_receipt/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReceiptsTable
      Events:
        GetReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/{receiptId}
            Method: GET

  UpdateReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/update_receipt/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptsTable
      Events:
        UpdateReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/{receiptId}
            Method: PUT

  DeleteReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/delete_receipt/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptsTable
        - S3CrudPolicy:
            BucketName: !Ref ReceiptsBucket
      Events:
        DeleteReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/{receiptId}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${ReceiptApi}.execute-api.${AWS::Region}.amazonaws.com/dev
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ReceiptsBucketName:
    Value: !Ref ReceiptsBucket
  ReceiptsTableName:
    Value: !Ref ReceiptsTable
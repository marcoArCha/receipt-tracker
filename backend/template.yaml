AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Receipt Tracker with OCR - backend infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ReceiptsTable
        BUCKET_NAME: !Ref ReceiptsBucket

Resources:

  # ---------- Storage ----------

  ReceiptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: receipts-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub receipt-tracker-images-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ---------- Auth ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: receipt-tracker-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: receipt-tracker-web
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ---------- API Gateway (placeholder, filled in Step 5) ----------
  # ---------- Lambda functions (placeholder, filled in Step 5) ----------

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ReceiptsBucketName:
    Value: !Ref ReceiptsBucket
  ReceiptsTableName:
    Value: !Ref ReceiptsTable